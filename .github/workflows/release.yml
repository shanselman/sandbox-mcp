name: Release

on:
  release:
    types: [published]
  # Manual runs build and test the package and keep it as a workflow artifact; they never touch a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci --omit=dev
      - run: npm test
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Identify build channel
        shell: pwsh
        run: |
          $channel = if ('${{ github.event_name }}' -eq 'release') { 'release' } else { 'feature-preview' }
          "SANDBOX_MCP_BUILD_CHANNEL=$channel" >> $env:GITHUB_ENV
      - run: npm run package:win
      - run: npm run package:bun:win
      - name: Smoke-test Node package
        run: node test/package-smoke.js dist\sandbox-mcp-win-x64-v${{ steps.version.outputs.value }}.zip
        shell: pwsh
      - name: Smoke-test Bun package
        run: node test/package-smoke.js dist\sandbox-mcp-win-x64-v${{ steps.version.outputs.value }}-bun.zip
        shell: pwsh
      - name: Smoke-test Bun relinking source
        run: node test/package-source-smoke.js dist\sandbox-mcp-win-x64-v${{ steps.version.outputs.value }}-bun-relink-source.zip dist\sandbox-mcp-win-x64-v${{ steps.version.outputs.value }}-bun.zip
        shell: pwsh
      - name: Name candidates and publish SHA256
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $short = '${{ github.sha }}'.Substring(0, 7)
            foreach ($asset in Get-ChildItem dist\*.zip) {
              $suffix = if ($asset.Name -match '-bun-relink-source\.zip$') { '-bun-relink-source.zip' }
                elseif ($asset.Name -match '-bun\.zip$') { '-bun.zip' }
                else { '.zip' }
              $name = "sandbox-mcp-feature-preview-$version-$short-win-x64$suffix"
              Rename-Item -LiteralPath $asset.FullName -NewName $name
            }
          }
          "### Verified Windows x64 packages`n" >> $env:GITHUB_STEP_SUMMARY
          foreach ($asset in Get-ChildItem dist\*.zip | Sort-Object Name) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($asset.FullName).sha256", "$hash  $($asset.Name)`n", [Text.UTF8Encoding]::new($false))
            "- ``$($asset.Name)`` — SHA256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Keep packages (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-mcp-win-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Upload Windows x64 package
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$version") { throw "Release tag $tag does not match package version v$version." }
          $files = @()
          foreach ($asset in Get-ChildItem dist\*.zip) {
            $files += $asset.FullName
            $files += "$($asset.FullName).sha256"
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset/checksum upload failed.' }
        shell: pwsh
